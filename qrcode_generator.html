<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR コード生成ツール</title>
    <style>
      body {
        font-family: sans-serif;
        line-height: 1.6;
        margin: 2em auto;
        max-width: 900px;
      }

      input,
      button,
      select,
      textarea {
        font: inherit;
      }

      textarea {
        box-sizing: border-box;
        min-height: 8em;
        width: 100%;
      }

      .field {
        margin: 1em 0;
      }

      .field label {
        display: block;
        font-weight: bold;
        margin-bottom: 0.25em;
      }

      .controls {
        display: grid;
        gap: 1em;
        grid-template-columns: repeat(auto-fit, minmax(12em, 1fr));
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
        margin: 1em 0;
      }

      .result {
        align-items: start;
        display: grid;
        gap: 1.5em;
        grid-template-columns: minmax(16em, 22em) 1fr;
        margin-top: 1.5em;
      }

      .preview {
        border: 1px solid #ddd;
        box-sizing: border-box;
        display: grid;
        min-height: 18em;
        padding: 1em;
        place-items: center;
      }

      .preview svg {
        display: block;
        height: auto;
        max-width: 100%;
      }

      .message {
        background: #f4f4f4;
        min-height: 3em;
        overflow-x: auto;
        padding: 1em;
        white-space: pre-wrap;
      }

      @media (max-width: 720px) {
        .result {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>QR コード生成</h1>

    <main>
      <div class="field">
        <label for="text">テキスト</label>
        <textarea id="text" placeholder="QR コードにしたい文字列を入力してください">https://mikoto2000.github.io/</textarea>
      </div>

      <div class="controls">
        <div class="field">
          <label for="errorCorrection">誤り訂正レベル</label>
          <select id="errorCorrection">
            <option value="L">L - 約 7%</option>
            <option value="M" selected>M - 約 15%</option>
            <option value="Q">Q - 約 25%</option>
            <option value="H">H - 約 30%</option>
          </select>
        </div>

        <div class="field">
          <label for="size">画像サイズ</label>
          <input id="size" type="number" min="128" max="1024" step="16" value="256">
        </div>

        <div class="field">
          <label for="margin">余白</label>
          <input id="margin" type="number" min="0" max="16" step="1" value="4">
        </div>
      </div>

      <div class="actions">
        <button id="generateButton" type="button">生成</button>
        <button id="downloadButton" type="button">SVG ダウンロード</button>
      </div>

      <section class="result">
        <div id="preview" class="preview"></div>
        <pre id="message" class="message"></pre>
      </section>
    </main>

    <script type="module">
      const textInput = document.getElementById("text");
      const errorCorrectionSelect = document.getElementById("errorCorrection");
      const sizeInput = document.getElementById("size");
      const marginInput = document.getElementById("margin");
      const generateButton = document.getElementById("generateButton");
      const downloadButton = document.getElementById("downloadButton");
      const preview = document.getElementById("preview");
      const message = document.getElementById("message");

      const EC_LEVEL_BITS = { M: 0, L: 1, H: 2, Q: 3 };
      const MASK_XOR = 0x5412;
      const FORMAT_POLY = 0x537;
      const VERSION_SPECS = [
        null,
        { size: 21, ec: { L: { ecc: 7, blocks: [19] }, M: { ecc: 10, blocks: [16] }, Q: { ecc: 13, blocks: [13] }, H: { ecc: 17, blocks: [9] } } },
        { size: 25, ec: { L: { ecc: 10, blocks: [34] }, M: { ecc: 16, blocks: [28] }, Q: { ecc: 22, blocks: [22] }, H: { ecc: 28, blocks: [16] } } },
        { size: 29, ec: { L: { ecc: 15, blocks: [55] }, M: { ecc: 26, blocks: [44] }, Q: { ecc: 18, blocks: [17, 17] }, H: { ecc: 22, blocks: [13, 13] } } },
        { size: 33, ec: { L: { ecc: 20, blocks: [80] }, M: { ecc: 18, blocks: [32, 32] }, Q: { ecc: 26, blocks: [24, 24] }, H: { ecc: 16, blocks: [9, 9, 9, 9] } } },
      ];

      const gfExp = new Array(512);
      const gfLog = new Array(256);
      let value = 1;
      for (let i = 0; i < 255; i += 1) {
        gfExp[i] = value;
        gfLog[value] = i;
        value <<= 1;
        if (value & 0x100) {
          value ^= 0x11d;
        }
      }
      for (let i = 255; i < 512; i += 1) {
        gfExp[i] = gfExp[i - 255];
      }

      const multiply = (a, b) => (a === 0 || b === 0 ? 0 : gfExp[gfLog[a] + gfLog[b]]);

      const makeGenerator = (degree) => {
        let coefficients = [1];
        for (let i = 0; i < degree; i += 1) {
          const next = new Array(coefficients.length + 1).fill(0);
          coefficients.forEach((coefficient, index) => {
            next[index] ^= coefficient;
            next[index + 1] ^= multiply(coefficient, gfExp[i]);
          });
          coefficients = next;
        }
        return coefficients;
      };

      const makeErrorCorrection = (data, eccLength) => {
        const generator = makeGenerator(eccLength);
        const remainder = new Array(eccLength).fill(0);
        data.forEach((byte) => {
          const factor = byte ^ remainder.shift();
          remainder.push(0);
          for (let i = 0; i < eccLength; i += 1) {
            remainder[i] ^= multiply(generator[i + 1], factor);
          }
        });
        return remainder;
      };

      const pushBits = (bits, number, length) => {
        for (let i = length - 1; i >= 0; i -= 1) {
          bits.push((number >>> i) & 1);
        }
      };

      const chooseVersion = (bytes, level) => {
        for (let version = 1; version < VERSION_SPECS.length; version += 1) {
          const spec = VERSION_SPECS[version].ec[level];
          const dataCodewords = spec.blocks.reduce((sum, block) => sum + block, 0);
          if (12 + bytes.length * 8 <= dataCodewords * 8) {
            return version;
          }
        }
        throw new Error("入力が長すぎます。Version 1-4 の QR コードに収まる文字列を入力してください。");
      };

      const encodeData = (bytes, version, level) => {
        const spec = VERSION_SPECS[version].ec[level];
        const dataCodewords = spec.blocks.reduce((sum, block) => sum + block, 0);
        const bits = [];
        pushBits(bits, 0b0100, 4);
        pushBits(bits, bytes.length, 8);
        bytes.forEach((byte) => pushBits(bits, byte, 8));

        const maxBits = dataCodewords * 8;
        pushBits(bits, 0, Math.min(4, maxBits - bits.length));
        while (bits.length % 8 !== 0) {
          bits.push(0);
        }

        const data = [];
        for (let i = 0; i < bits.length; i += 8) {
          data.push(Number.parseInt(bits.slice(i, i + 8).join(""), 2));
        }
        for (let pad = 0xec; data.length < dataCodewords; pad ^= 0xec ^ 0x11) {
          data.push(pad);
        }

        const blocks = [];
        let offset = 0;
        spec.blocks.forEach((blockLength) => {
          const blockData = data.slice(offset, offset + blockLength);
          offset += blockLength;
          blocks.push({ data: blockData, ecc: makeErrorCorrection(blockData, spec.ecc) });
        });

        const codewords = [];
        const maxDataLength = Math.max(...blocks.map((block) => block.data.length));
        for (let i = 0; i < maxDataLength; i += 1) {
          blocks.forEach((block) => {
            if (i < block.data.length) {
              codewords.push(block.data[i]);
            }
          });
        }
        for (let i = 0; i < spec.ecc; i += 1) {
          blocks.forEach((block) => codewords.push(block.ecc[i]));
        }
        return codewords;
      };

      const makeMatrix = (version) => {
        const size = VERSION_SPECS[version].size;
        const modules = Array.from({ length: size }, () => new Array(size).fill(false));
        const reserved = Array.from({ length: size }, () => new Array(size).fill(false));

        const set = (x, y, dark, isReserved = true) => {
          if (x < 0 || y < 0 || x >= size || y >= size) return;
          modules[y][x] = dark;
          reserved[y][x] = isReserved;
        };

        const finder = (x, y) => {
          for (let dy = -1; dy <= 7; dy += 1) {
            for (let dx = -1; dx <= 7; dx += 1) {
              const xx = x + dx;
              const yy = y + dy;
              const inOuter = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6;
              const inInner = dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4;
              set(xx, yy, inOuter && (dx === 0 || dx === 6 || dy === 0 || dy === 6 || inInner));
            }
          }
        };

        finder(0, 0);
        finder(size - 7, 0);
        finder(0, size - 7);

        for (let i = 8; i < size - 8; i += 1) {
          set(6, i, i % 2 === 0);
          set(i, 6, i % 2 === 0);
        }

        if (version > 1) {
          const center = size - 7;
          for (let y = center - 2; y <= center + 2; y += 1) {
            for (let x = center - 2; x <= center + 2; x += 1) {
              const distance = Math.max(Math.abs(x - center), Math.abs(y - center));
              set(x, y, distance !== 1);
            }
          }
        }

        set(8, size - 8, true);
        for (let i = 0; i < 9; i += 1) {
          if (i !== 6) {
            reserved[8][i] = true;
            reserved[i][8] = true;
          }
        }
        for (let i = 0; i < 8; i += 1) {
          reserved[size - 1 - i][8] = true;
          reserved[8][size - 1 - i] = true;
        }

        return { modules, reserved, size };
      };

      const maskApplies = (mask, x, y) => {
        switch (mask) {
          case 0: return (x + y) % 2 === 0;
          case 1: return y % 2 === 0;
          case 2: return x % 3 === 0;
          case 3: return (x + y) % 3 === 0;
          case 4: return (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0;
          case 5: return ((x * y) % 2) + ((x * y) % 3) === 0;
          case 6: return (((x * y) % 2) + ((x * y) % 3)) % 2 === 0;
          case 7: return (((x + y) % 2) + ((x * y) % 3)) % 2 === 0;
          default: return false;
        }
      };

      const placeData = (matrix, codewords, mask) => {
        const { modules, reserved, size } = matrix;
        const bits = [];
        codewords.forEach((byte) => pushBits(bits, byte, 8));
        let bitIndex = 0;
        let upward = true;

        for (let right = size - 1; right >= 1; right -= 2) {
          if (right === 6) right -= 1;
          for (let vertical = 0; vertical < size; vertical += 1) {
            const y = upward ? size - 1 - vertical : vertical;
            for (let dx = 0; dx < 2; dx += 1) {
              const x = right - dx;
              if (!reserved[y][x]) {
                const bit = bitIndex < bits.length ? bits[bitIndex] === 1 : false;
                modules[y][x] = maskApplies(mask, x, y) ? !bit : bit;
                bitIndex += 1;
              }
            }
          }
          upward = !upward;
        }
      };

      const formatBits = (level, mask) => {
        let data = (EC_LEVEL_BITS[level] << 3) | mask;
        let bits = data << 10;
        for (let i = 14; i >= 10; i -= 1) {
          if ((bits >>> i) & 1) {
            bits ^= FORMAT_POLY << (i - 10);
          }
        }
        return (((data << 10) | bits) ^ MASK_XOR) & 0x7fff;
      };

      const applyFormat = (matrix, level, mask) => {
        const { modules, size } = matrix;
        const bits = formatBits(level, mask);
        const first = [[8, 0], [8, 1], [8, 2], [8, 3], [8, 4], [8, 5], [8, 7], [8, 8], [7, 8], [5, 8], [4, 8], [3, 8], [2, 8], [1, 8], [0, 8]];
        const second = [[size - 1, 8], [size - 2, 8], [size - 3, 8], [size - 4, 8], [size - 5, 8], [size - 6, 8], [size - 7, 8], [size - 8, 8], [8, size - 7], [8, size - 6], [8, size - 5], [8, size - 4], [8, size - 3], [8, size - 2], [8, size - 1]];
        first.forEach(([x, y], index) => {
          modules[y][x] = ((bits >>> index) & 1) === 1;
        });
        second.forEach(([x, y], index) => {
          modules[y][x] = ((bits >>> index) & 1) === 1;
        });
      };

      const scoreMatrix = (modules) => {
        const size = modules.length;
        let score = 0;

        for (let y = 0; y < size; y += 1) {
          let runColor = modules[y][0];
          let runLength = 1;
          for (let x = 1; x < size; x += 1) {
            if (modules[y][x] === runColor) {
              runLength += 1;
            } else {
              if (runLength >= 5) score += 3 + runLength - 5;
              runColor = modules[y][x];
              runLength = 1;
            }
          }
          if (runLength >= 5) score += 3 + runLength - 5;
        }

        for (let x = 0; x < size; x += 1) {
          let runColor = modules[0][x];
          let runLength = 1;
          for (let y = 1; y < size; y += 1) {
            if (modules[y][x] === runColor) {
              runLength += 1;
            } else {
              if (runLength >= 5) score += 3 + runLength - 5;
              runColor = modules[y][x];
              runLength = 1;
            }
          }
          if (runLength >= 5) score += 3 + runLength - 5;
        }

        for (let y = 0; y < size - 1; y += 1) {
          for (let x = 0; x < size - 1; x += 1) {
            const color = modules[y][x];
            if (modules[y][x + 1] === color && modules[y + 1][x] === color && modules[y + 1][x + 1] === color) {
              score += 3;
            }
          }
        }

        const pattern = "10111010000";
        const reversePattern = "00001011101";
        for (let y = 0; y < size; y += 1) {
          const row = modules[y].map((cell) => (cell ? "1" : "0")).join("");
          for (let x = 0; x <= size - 11; x += 1) {
            const chunk = row.slice(x, x + 11);
            if (chunk === pattern || chunk === reversePattern) score += 40;
          }
        }
        for (let x = 0; x < size; x += 1) {
          let column = "";
          for (let y = 0; y < size; y += 1) column += modules[y][x] ? "1" : "0";
          for (let y = 0; y <= size - 11; y += 1) {
            const chunk = column.slice(y, y + 11);
            if (chunk === pattern || chunk === reversePattern) score += 40;
          }
        }

        const dark = modules.flat().filter(Boolean).length;
        const percentage = (dark * 100) / (size * size);
        score += Math.floor(Math.abs(percentage - 50) / 5) * 10;
        return score;
      };

      const createQr = (text, level) => {
        const bytes = new TextEncoder().encode(text);
        if (bytes.length === 0) {
          throw new Error("テキストを入力してください。");
        }
        const version = chooseVersion(bytes, level);
        const codewords = encodeData(bytes, version, level);
        let best = null;

        for (let mask = 0; mask < 8; mask += 1) {
          const matrix = makeMatrix(version);
          placeData(matrix, codewords, mask);
          applyFormat(matrix, level, mask);
          const score = scoreMatrix(matrix.modules);
          if (!best || score < best.score) {
            best = { ...matrix, mask, score, version, bytes: bytes.length };
          }
        }

        return best;
      };

      const toSvg = (qr, pixelSize, quietZone) => {
        const totalModules = qr.size + quietZone * 2;
        const moduleSize = pixelSize / totalModules;
        const rects = [];
        qr.modules.forEach((row, y) => {
          row.forEach((dark, x) => {
            if (dark) {
              rects.push(`<rect x="${(x + quietZone) * moduleSize}" y="${(y + quietZone) * moduleSize}" width="${moduleSize}" height="${moduleSize}"/>`);
            }
          });
        });
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${pixelSize}" height="${pixelSize}" viewBox="0 0 ${pixelSize} ${pixelSize}" role="img" aria-label="Generated QR code"><rect width="100%" height="100%" fill="#fff"/><g fill="#000">${rects.join("")}</g></svg>`;
      };

      const render = () => {
        try {
          const qr = createQr(textInput.value, errorCorrectionSelect.value);
          const pixelSize = Math.max(128, Math.min(1024, Number(sizeInput.value) || 256));
          const quietZone = Math.max(0, Math.min(16, Number(marginInput.value) || 0));
          const svg = toSvg(qr, pixelSize, quietZone);
          preview.innerHTML = svg;
          message.textContent = `生成しました
Version: ${qr.version}
入力サイズ: ${qr.bytes} bytes
誤り訂正: ${errorCorrectionSelect.value}
Mask: ${qr.mask}`;
        } catch (error) {
          preview.textContent = "";
          message.textContent = error.message;
        }
      };

      generateButton.addEventListener("click", render);
      textInput.addEventListener("input", render);
      errorCorrectionSelect.addEventListener("change", render);
      sizeInput.addEventListener("change", render);
      marginInput.addEventListener("change", render);

      downloadButton.addEventListener("click", () => {
        const svg = preview.querySelector("svg");
        if (!svg) {
          message.textContent = "先に QR コードを生成してください。";
          return;
        }
        const blob = new Blob([svg.outerHTML], { type: "image/svg+xml" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "qrcode.svg";
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      });

      render();
    </script>
  </body>
</html>
