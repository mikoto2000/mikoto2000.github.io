<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR コード生成ツール</title>
    <style>
      body {
        font-family: sans-serif;
        line-height: 1.6;
        margin: 2em auto;
        max-width: 900px;
      }

      input,
      button,
      select,
      textarea {
        font: inherit;
      }

      textarea {
        box-sizing: border-box;
        min-height: 8em;
        width: 100%;
      }

      .field {
        margin: 1em 0;
      }

      .field label {
        display: block;
        font-weight: bold;
        margin-bottom: 0.25em;
      }

      .controls {
        display: grid;
        gap: 1em;
        grid-template-columns: repeat(auto-fit, minmax(12em, 1fr));
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
        margin: 1em 0;
      }

      .result {
        align-items: start;
        display: grid;
        gap: 1.5em;
        grid-template-columns: minmax(16em, 22em) 1fr;
        margin-top: 1.5em;
      }

      .preview {
        border: 1px solid #ddd;
        box-sizing: border-box;
        display: grid;
        min-height: 18em;
        padding: 1em;
        place-items: center;
      }

      .preview svg {
        display: block;
        height: auto;
        max-width: 100%;
      }

      .message {
        background: #f4f4f4;
        min-height: 3em;
        overflow-x: auto;
        padding: 1em;
        white-space: pre-wrap;
      }

      @media (max-width: 720px) {
        .result {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.min.js"></script>
  </head>
  <body>
    <h1>QR コード生成</h1>

    <main>
      <div class="field">
        <label for="text">テキスト</label>
        <textarea id="text" placeholder="QR コードにしたい文字列を入力してください">https://mikoto2000.github.io/</textarea>
      </div>

      <div class="controls">
        <div class="field">
          <label for="errorCorrection">誤り訂正レベル</label>
          <select id="errorCorrection">
            <option value="L">L - 約 7%</option>
            <option value="M" selected>M - 約 15%</option>
            <option value="Q">Q - 約 25%</option>
            <option value="H">H - 約 30%</option>
          </select>
        </div>

        <div class="field">
          <label for="size">画像サイズ</label>
          <input id="size" type="number" min="128" max="1024" step="16" value="256">
        </div>

        <div class="field">
          <label for="margin">余白</label>
          <input id="margin" type="number" min="0" max="16" step="1" value="4">
        </div>
      </div>

      <div class="actions">
        <button id="downloadSvgButton" type="button">SVG ダウンロード</button>
        <button id="downloadPngButton" type="button">PNG ダウンロード</button>
      </div>

      <section class="result">
        <div id="preview" class="preview"></div>
        <pre id="message" class="message"></pre>
      </section>
    </main>

    <script>
      const textInput = document.getElementById("text");
      const errorCorrectionSelect = document.getElementById("errorCorrection");
      const sizeInput = document.getElementById("size");
      const marginInput = document.getElementById("margin");
      const downloadSvgButton = document.getElementById("downloadSvgButton");
      const downloadPngButton = document.getElementById("downloadPngButton");
      const preview = document.getElementById("preview");
      const message = document.getElementById("message");

      const clampNumber = (input, min, max, fallback) => {
        const value = Number(input.value);
        if (!Number.isFinite(value)) {
          return fallback;
        }
        return Math.max(min, Math.min(max, value));
      };

      const render = () => {
        try {
          const text = textInput.value;
          if (!text) {
            throw new Error("テキストを入力してください。");
          }
          if (typeof qrcode !== "function") {
            throw new Error("QR コード生成ライブラリを読み込めませんでした。");
          }

          const size = clampNumber(sizeInput, 128, 1024, 256);
          const margin = clampNumber(marginInput, 0, 16, 4);
          const qr = qrcode(0, errorCorrectionSelect.value);
          qr.addData(text);
          qr.make();

          preview.innerHTML = qr.createSvgTag({ cellSize: 1, margin, scalable: true });
          const svg = preview.querySelector("svg");
          svg.setAttribute("width", String(size));
          svg.setAttribute("height", String(size));
          svg.setAttribute("role", "img");
          svg.setAttribute("aria-label", "Generated QR code");

          const moduleCount = qr.getModuleCount();
          message.textContent = `生成しました
Version: ${(moduleCount - 17) / 4}
Module count: ${moduleCount}
誤り訂正: ${errorCorrectionSelect.value}`;
        } catch (error) {
          preview.textContent = "";
          message.textContent = error.message;
        }
      };

      textInput.addEventListener("input", render);
      errorCorrectionSelect.addEventListener("change", render);
      sizeInput.addEventListener("change", render);
      marginInput.addEventListener("change", render);

      const getCurrentSvg = () => {
        const svg = preview.querySelector("svg");
        if (!svg) {
          message.textContent = "先に QR コードを生成してください。";
        }
        return svg;
      };

      const downloadBlob = (blob, fileName) => {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = fileName;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      };

      downloadSvgButton.addEventListener("click", () => {
        const svg = getCurrentSvg();
        if (!svg) {
          return;
        }

        downloadBlob(new Blob([svg.outerHTML], { type: "image/svg+xml" }), "qrcode.svg");
      });

      downloadPngButton.addEventListener("click", async () => {
        const svg = getCurrentSvg();
        if (!svg) {
          return;
        }

        let url;
        try {
          const size = clampNumber(sizeInput, 128, 1024, 256);
          const svgBlob = new Blob([svg.outerHTML], { type: "image/svg+xml" });
          url = URL.createObjectURL(svgBlob);
          const image = new Image();

          const loaded = new Promise((resolve, reject) => {
            image.addEventListener("load", resolve, { once: true });
            image.addEventListener("error", () => reject(new Error("PNG 変換用の画像読み込みに失敗しました。")), { once: true });
          });

          image.src = url;
          await loaded;

          const canvas = document.createElement("canvas");
          canvas.width = size;
          canvas.height = size;
          const context = canvas.getContext("2d");
          context.fillStyle = "#fff";
          context.fillRect(0, 0, size, size);
          context.drawImage(image, 0, 0, size, size);

          canvas.toBlob((pngBlob) => {
            if (!pngBlob) {
              message.textContent = "PNG 変換に失敗しました。";
              return;
            }
            downloadBlob(pngBlob, "qrcode.png");
          }, "image/png");
        } catch (error) {
          message.textContent = error.message;
        } finally {
          if (url) {
            URL.revokeObjectURL(url);
          }
        }
      });

      render();
    </script>
  </body>
</html>
