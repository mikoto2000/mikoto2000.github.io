<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>URL encode/decode ツール</title>
    <style>
      body {
        font-family: sans-serif;
        line-height: 1.6;
        margin: 2em auto;
        max-width: 900px;
      }

      input,
      button,
      select,
      textarea {
        font: inherit;
      }

      textarea {
        box-sizing: border-box;
        display: block;
        min-height: 10em;
        width: 100%;
      }

      .field {
        margin: 1em 0;
      }

      .field label {
        display: block;
        font-weight: bold;
        margin-bottom: 0.25em;
      }

      .controls {
        display: grid;
        gap: 1em;
        grid-template-columns: repeat(auto-fit, minmax(14em, 1fr));
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5em;
        margin: 1em 0;
      }

      .status {
        min-height: 1.6em;
      }
    </style>
  </head>
  <body>
    <h1>URL encode/decode</h1>

    <main>
      <div class="controls">
        <div class="field">
          <label for="mode">処理</label>
          <select id="mode">
            <option value="encode">エンコード</option>
            <option value="decode">デコード</option>
          </select>
        </div>

        <div class="field">
          <label for="format">形式</label>
          <select id="format">
            <option value="component">URL コンポーネント</option>
            <option value="form">フォーム形式 (+ をスペースとして扱う)</option>
            <option value="url">URL 全体</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="input">入力</label>
        <textarea id="input" placeholder="エンコードまたはデコードする文字列を入力してください"></textarea>
      </div>

      <div class="actions">
        <button id="convert" type="button">変換</button>
        <button id="copy" type="button">コピー</button>
        <button id="swap" type="button">入れ替え</button>
        <button id="clear" type="button">クリア</button>
      </div>

      <div class="field">
        <label for="output">出力</label>
        <textarea id="output" readonly placeholder="変換結果がここに表示されます"></textarea>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script type="module">
      const mode = document.getElementById("mode");
      const format = document.getElementById("format");
      const input = document.getElementById("input");
      const output = document.getElementById("output");
      const convertButton = document.getElementById("convert");
      const copyButton = document.getElementById("copy");
      const swapButton = document.getElementById("swap");
      const clearButton = document.getElementById("clear");
      const status = document.getElementById("status");

      const encodeUrl = (value) => {
        if (format.value === "url") {
          return encodeURI(value);
        }

        const encoded = encodeURIComponent(value);
        if (format.value === "form") {
          return encoded.replace(/%20/g, "+");
        }

        return encoded;
      };

      const decodeUrl = (value) => {
        const target = format.value === "form" ? value.replace(/\+/g, " ") : value;
        if (format.value === "url") {
          return decodeURI(target);
        }

        return decodeURIComponent(target);
      };

      const convert = () => {
        try {
          if (!input.value) {
            output.value = "";
            status.textContent = "入力してください";
            return;
          }

          output.value = mode.value === "encode" ? encodeUrl(input.value) : decodeUrl(input.value);
          status.textContent = "変換しました";
        } catch (error) {
          status.textContent = `変換に失敗しました: ${error.message}`;
        }
      };

      convertButton.addEventListener("click", convert);

      copyButton.addEventListener("click", async () => {
        try {
          if (!output.value) {
            status.textContent = "コピーする結果がありません";
            return;
          }

          await navigator.clipboard.writeText(output.value);
          status.textContent = "コピーしました";
        } catch (error) {
          status.textContent = `コピーに失敗しました: ${error.message}`;
        }
      });

      swapButton.addEventListener("click", () => {
        input.value = output.value;
        output.value = "";
        mode.value = mode.value === "encode" ? "decode" : "encode";
        status.textContent = "入力と処理を入れ替えました";
      });

      clearButton.addEventListener("click", () => {
        input.value = "";
        output.value = "";
        status.textContent = "";
      });
    </script>
  </body>
</html>
